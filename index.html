EKT • AĞILLI ŞƏHƏR", "Building a safer,": "Daha təhlükəsiz,", "data-driven city.": "məlumatlara əsaslanan şəhər qururuq.", "An urban safety platform for monitoring fire hydrants, predicting infrastructure failures and improving emergency response. FireShield turns hydrants from forgotten street furniture into data-driven nodes of an urban safety network.": "Yanğın hidrantlarının monitorinqi, infrastruktur nasazlıqlarının proqnozlaşdırılması və fövqəladə hallara reaksiyanın yaxşılaşdırılması üçün şəhər təhlükəsizliyi platforması. FireShield hidrantları unudulmuş küçə avadanlığından şəhər təhlükəsizlik şəbəkəsinin məlumatlara əsaslanan qovşaqlarına çevirir.", "Explore the map": "Xəritəyə bax", "How it works": "Necə işləyir", "Hydrants in the register": "Reyestrdəki hidrantlar", "Districts covered": "Əhatə olunan rayonlar", "Flagged critical": "Kritik kimi işarələnib", "Not yet verified": "Hələ yoxlanılmayıb", "baku · hydrant layer": "bakı · hidrant qatı", "Reference data": "İstinad məlumatları", "Why FireShield": "Niyə FireShield", "When a truck arrives and the nearest hydrant is dry, seized or buried behind parked cars, the delay is measured in minutes that matter. Four capabilities, working on one register.": "Yanğın maşını gələndə ən yaxın hidrant qurudursa, sıxılıb qalıbsa və ya park edilmiş avtomobillərin arxasında qalıbsa, gecikmə həlledici dəqiqələrlə ölçülür. Vahid reyestr üzərində işləyən dörd imkan.", "Monitor": "Monitorinq", "Digitise every hydrant into one register: location, water, pressure, access, condition. A city cannot maintain what it has never counted.": "Hər hidrantı vahid reyestrdə rəqəmsallaşdırın: yer, su, təzyiq, giriş, vəziyyət. Şəhər heç vaxt saymadığı şeyə qulluq edə bilməz.", "Predict": "Proqnoz", "Rank hydrants by the conditions that precede failure, so limited maintenance crews start with the assets most likely to let a fire crew down.": "Hidrantları nasazlıqdan əvvəl gələn şərtlərə görə sıralayın ki, məhdud texniki xidmət briqadaları yanğınsöndürənləri ən çox yarı yolda qoya biləcək obyektlərdən başlasın.", "Simulate": "Simulyasiya", "Replay a fire at a school, hospital or apartment block against the register and see which water points would actually answer.": "Məktəbdə, xəstəxanada və ya yaşayış binasında yanğını reyestr üzərində canlandırın və hansı su nöqtələrinin həqiqətən işləyəcəyini görün.", "Engage": "Cəlb et", "Residents pass a hydrant every day. Give them a way to report damage and blocked access, and the register stays current between surveys.": "Sakinlər hər gün hidrantın yanından keçirlər. Onlara zədə və bağlı giriş barədə məlumat vermək imkanı verin, reyestr isə baxışlar arasında aktual qalsın.", "From a clipboard survey to a city system": "Kağız sorğudan şəhər sisteminə", "Seven interconnected stages working on one register. Select a stage to see what it does — each status is checked live against the data loaded in this page.": "Vahid reyestr üzərində işləyən yeddi əlaqəli mərhələ. Nə etdiyini görmək üçün mərhələni seçin — hər statusun bu səhifədə yüklənmiş məlumatlara görə canlı yoxlanılır.", "Audit": "Audit", "Data": "Məlumat", "Risk model": "Risk modeli", "Civic network": "Vətəndaş şəbəkəsi", "Smart city": "Ağıllı şəhər", "Operational · rule-based": "İşlək · qaydalara əsaslanan", "Operational · browser storage": "İşlək · brauzer yaddaşı", "Operational · session only": "İşlək · yalnız sessiya", "Sensor feed not connected": "Sensor axını qoşulmayıb", "Check failed": "Yoxlama uğursuz oldu", "Every hydrant carries its field inspection: condition, water at the outlet, access for a truck, corrosion, recorded faults, inspection date and the surveyor's notes — all retrievable from the record page.": "Hər hidrantın sahə yoxlaması var: vəziyyət, çıxışda su, maşın üçün giriş, korroziya, qeydə alınmış nasazlıqlar, yoxlama tarixi və müfəttişin qeydləri — hamısı qeyd səhifəsindən əldə edilir.", "One structured register with a fixed schema — ID, coordinates, status, pressure, inspection history and risk attributes — shared by the map, the database, analytics and the simulation, and kept across page reloads.": "Sabit sxemli vahid strukturlaşdırılmış reyestr — ID, koordinatlar, status, təzyiq, yoxlama tarixçəsi və risk atributları — xəritə, verilənlər bazası, analitika və simulyasiya tərəfindən paylaşılır və səhifə yeniləndikdə saxlanılır.", "The register on a live map of Baku. Filters, markers, popups and selection all read the same records, so a dispatcher sees the nearest working water point without opening a spreadsheet.": "Reyestr Bakının canlı xəritəsində. Filtrlər, markerlər, pəncərələr və seçim eyni qeydləri oxuyur, beləliklə dispetçer cədvəl açmadan ən yaxın işlək su nöqtəsini görür.", "A transparent rule-based score from 0 to 100, built from corrosion, previous failures, age, pressure, access, water availability, inspection gap and coastal exposure. The same score sets the status shown on the map, in the database and in analytics.": "Korroziya, əvvəlki nasazlıqlar, yaş, təzyiq, giriş, suyun mövcudluğu, yoxlama fasiləsi və sahil təsirindən qurulan 0-dan 100-ə qədər şəffaf, qaydalara əsaslanan bal. Eyni bal xəritədə, verilənlər bazasında və analitikada göstərilən statusu müəyyən edir.", "Replay an incident against the register: which hydrants would answer, the straight-line distance to each, the estimated supply and where it falls short of the scenario demand.": "Hadisəni reyestr üzərində canlandırın: hansı hidrantlar işləyəcək, hər birinə düz xətt məsafəsi, təxmini təchizat və ssenari tələbatından harada az qalır.", "Residents adopt a hydrant nearby, report damage or blocked access and follow each report's status, keeping the register current between official surveys.": "Sakinlər yaxınlıqdakı hidrantı himayəyə götürür, zədə və ya bağlı giriş barədə məlumat verir və hər hesabatın statusunu izləyir, reyestri rəsmi baxışlar arasında aktual saxlayır.", "The register is structured to take pressure and flow readings from sensors so that it updates itself. Pressure values shown today come from the last recorded field inspection, not from live devices.": "Reyestr özünü yeniləmək üçün sensorlardan təzyiq və axın göstəricilərini qəbul edəcək şəkildə qurulub. Hazırda göstərilən təzyiq dəyərləri canlı cihazlardan deyil, son qeydə alınmış sahə yoxlamasından götürülür.", "no photos on file — image storage is not connected": "fayl kimi foto yoxdur — şəkil yaddaşı qoşulmayıb", "browser localStorage (persists across reloads)": "brauzerin localStorage yaddaşı (yeniləmədən sonra saxlanılır)", "memory for this session only": "yalnız bu sessiyanın yaddaşı", "no hydrants to simulate against": "simulyasiya üçün hidrant yoxdur", "school fire": "məktəb yanğını", "What the register currently says": "Reyestr hazırda nə göstərir", "Scored live by the same rule-based model the analytics page explains. The register is a synthetic reference dataset, so these figures describe the dataset, not the city's real network.": "Analitika səhifəsində izah olunan eyni qaydalara əsaslanan model ilə canlı qiymətləndirilir. Reyestr sintetik istinad məlumat dəstidir, ona görə bu rəqəmlər şəhərin real şəbəkəsini deyil, məlumat dəstini təsvir edir.", "Synthetic dataset ·": "Sintetik məlumat dəsti ·", "records": "qeyd", "Status breakdown": "Statuslar üzrə bölgü", "Open the analytics dashboard": "Analitika panelini aç", "Highest scoring hydrants": "Ən yüksək ballı hidrantlar", "Districts by mean risk": "Orta riskə görə rayonlar", "hydrants ·": "hidrant ·", "critical": "kritik", "Run an incident simulation": "Hadisə simulyasiyasını işə sal", "The register is only as good as the people keeping it current": "Reyestr onu aktual saxlayan insanlar qədər yaxşıdır", "Report a damaged hydrant on your street, or get in touch if you work with municipal, utility or emergency data and want to see where this could go.": "Küçənizdəki zədəli hidrant barədə məlumat verin və ya bələdiyyə, kommunal və ya fövqəladə hallar məlumatları ilə işləyirsinizsə və bunun hara gedə biləcə re must be a number in bar.": "Təzyiq bar ilə rəqəm olmalıdır.", "School approach, Yasamal": "Yasamal, məktəbə yaxınlaşma", "No record with that identifier": "Bu identifikatorla qeyd yoxdur", "It may have been added in a different browser, or cleared with a register reset.": "O, başqa brauzerdə əlavə edilmiş və ya reyestr sıfırlanarkən silinmiş ola bilər.", "Back to the database": "Verilənlər bazasına qayıt", "← Back": "← Geri", "Nearest other hydrants": "Ən yaxın digər hidrantlar", "Straight-line distance. If this one fails, these are the fallbacks a crew would reach for.": "Düz xətt məsafəsi. Bu hidrant işləməsə, briqada bunlara müraciət edəcək.", "Maintenance priority": "Texniki xidmət prioriteti", "Ranked": "Sıralama:", "out of": "/", "in the register by risk score. Districts and crews would work down this list from the top.": "(reyestrdə risk balına görə). Rayonlar və briqadalar bu siyahı üzrə yuxarıdan aşağı işləyərdi.", "Everything below is computed live from the synthetic register. The model is a transparent rule set, so any number can be traced back to the field that produced it.": "Aşağıdakı hər şey sintetik reyestrdən canlı hesablanır. Model şəffaf qaydalar toplusudur, ona görə hər rəqəmi onu yaradan sahəyə qədər izləmək olar.", "Rule-based model": "Qaydalara əsaslanan model", "Synthetic reference records": "Sintetik istinad qeydləri", "Verified and usable": "Yoxlanılıb və istifadəyə yararlıdır", "A defect is developing": "Nasazlıq yaranır", "Should not be relied on": "Ona etibar edilməməlidir", "Mean risk score": "Orta risk balı", "Across scored records": "Qiymətləndirilmiş qeydlər üzrə", "No water at the outlet": "Çıxışda su yoxdur", "Dry at the last inspection": "Son yoxlamada quru idi", "Approach blocked": "Yaxınlaşma bağlıdır", "A truck could not get a clear run": "Maşın sərbəst keçə bilmədi", "Never inspected": "Heç vaxt yoxlanılmayıb", "Located but unverified": "Yeri məlumdur, lakin yoxlanılmayıb", "Hydrants by condition": "Vəziyyətə görə hidrantlar", "Status is derived from the condition fields, not entered by hand.": "Status əl ilə daxil edilmir, vəziyyət sahələrindən hesablanır.", "Risk score distribution": "Risk balının paylanması", "How the register spreads across the 0–100 scale. A healthy city pushes this left.": "Reyestrin 0–100 şkalası üzrə paylanması. Sağlam şəhər bunu sola sürüşdürür.", "Hydrants by district": "Rayonlar üzrə hidrantlar", "Stacked by status, so coverage and condition are readable at once.": "Statusa görə yığılıb, beləliklə əhatə və vəziyyət eyni anda görünür.", "Reported faults over time": "Zamanla bildirilən nasazlıqlar", "Synthetic maintenance log. Winter months carry the load a real register would also show.": "Sintetik texniki xidmət jurnalı. Qış aylarında yük real reyestrdə də görünəcəyi kimi artır.", "Reported": "Bildirilib", "Resolved": "Həll edilib", "Charts are computed live from the synthetic register. No figure here describes real infrastructure.": "Qrafiklər sintetik reyestrdən canlı hesablanır. Buradakı heç bir rəqəm real infrastrukturu təsvir etmir.", "Predictive maintenance": "Proqnozlaşdırıcı texniki xidmət", "FireShield estimates infrastructure failure risk with a transparent rule-based model (services/riskModel.js): eight weighted condition factors produce a 0–100 score for every surveyed hydrant. It is a scoring rule set, not a machine-learning model trained on real inspection records.": "FireShield infrastruktur nasazlığı riskini şəffaf, qaydalara əsaslanan modellə qiymətləndirir (services/riskModel.js): səkkiz çəkili vəziyyət amili hər yoxlanılmış hidrant üçün 0–100 bal verir. Bu, real yoxlama qeydləri üzərində öyrədilmiş maşın öyrənməsi modeli deyil, qiymətləndirmə qaydaları toplusudur.", "Maintenance queue": "Texniki xidmət növbəsi", "Highest scoring hydrants first. Select one to see its breakdown.": "Ən yüksək ballı hidrantlar əvvəldə. Bölgüsünü görmək üçün birini seçin.", "No scored hydrants in the register.": "Reyestrdə qiymətləndirilmiş hidrant yoxdur.", "Where a crew would start": "Briqada haradan başlayardı", "Districts ordered by mean risk across their hydrants.": "Hidrantlarının orta riskinə görə sıralanmış rayonlar.", "Simulate urban fire scenarios before they happen. Pick a scenario — or drop the incident anywhere on the map — and the platform answers the question a crew asks first: which water points nearby would actually work?": "Şəhər yanğını ssenarilərini baş verməzdən əvvəl simulyasiya edin. Ssenari seçin — və ya hadisəni xəritədə istənilən yerə qoyun — platforma briqadanın ilk verdiyi suala cavab verir: yaxınlıqdakı hansı su nöqtələri həqiqətən işləyəcək?", "Simulation": "Simulyasiya", "School fire": "Məktəb yanğını", "Hospital fire": "Xəstəxana yanğını", "Residential building fire": "Yaşayış binası yanğını", "Site A — school block, Yasamal": "Obyekt A — məktəb binası, Yasamal", "Site B — hospital wing, Nasimi": "Obyekt B — xəstəxana korpusu, Nəsimi", "Site C — apartment block, Nizami": "Obyekt C — yaşayış binası, Nizami", "Custom point placed on the map": "Xəritədə qoyulmuş xüsusi nöqtə", "Reset to the scenario site": "Ssenari obyektinə qaytar", "Evacuation-heavy, moderate water demand, wide approach required for aerial appliance.": "Təxliyə yükü böyükdür, su tələbatı ortadır, nərdivanlı maşın üçün geniş yaxınlaşma lazımdır.", "Highest demand: sustained supply matters more than the first attack line.": "Ən yüksək tələbat: davamlı təchizat ilk hücum xəttindən daha vacibdir.", "Dense parking is the usual obstacle; blocked hydrants cost the most time here.": "Sıx parkinq adi maneədir; burada bağlı hidrantlar ən çox vaxt itirdir.", "Hydrants within 1.2 km": "1,2 km radiusda hidrantlar", "Usable right now": "Hazırda istifadəyə yararlı", "Estimated supply": "Təxmini təchizat", "l/min from the three nearest usable hydrants": "ən yaxın üç yararlı hidrantdan l/dəq", "Shortfall vs demand": "Tələbata görə çatışmazlıq", "Scenario demand ${} l/min": "Ssenari tələbatı {0} l/dəq", "Water points": "Su nöqtələri", "Primary": "Əsas", "Backup": "Ehtiyat", "No usable hydrant inside the search radius. In a real incident this is where a water shuttle or an open-water source would be needed.": "Axtarış radiusunda yararlı hidrant yoxdur. Real hadisədə burada su daşıyan maşın və ya açıq su mənbəyi lazım olardı.", "Nearby but not usable": "Yaxındadır, lakin yararsızdır", "condition never verified": "vəziyyət heç vaxt yoxlanılmayıb", "dry at the outlet": "çıxışda qurudur", "approach blocked": "yaxınlaşma bağlıdır", "flagged critical": "kritik kimi işarələnib", "Tap anywhere on the map to move the incident and re-run the simulation against the register. The 1.2 km search ring is wide because the register holds ${} points across the whole city.": "Hadisəni köçürmək və simulyasiyanı reyestr üzərində yenidən işə salmaq üçün xəritədə istənilən yerə toxunun. 1,2 km-lik axtarış dairəsi genişdir, çünki reyestrdə bütün şəhər üzrə {0} nöqtə var.", "Simulation method.": "Simulyasiya metodu.", "Distances are straight-line (haversine), supply is estimated at a fixed 220 l/min per bar from the three nearest usable hydrants, and the hydrants come from the synthetic reference register. Results support planning and are not operational guidance for a fire crew.": "Məsafələr düz xətt üzrədir (haversin), təchizat ən yaxın üç yararlı hidrantdan hər bar üçün sabit 220 l/dəq ilə qiymətləndirilir və hidrantlar sintetik istinad reyestrindən götürülür. Nəticələr planlaşdırmaya kömək edir və yanğınsöndürənlər üçün operativ təlimat deyil.", "Help keep your neighbourhood safer. A hydrant register goes stale within months unless the people who walk past it every day can flag what changed.": "Məhəllənizi daha təhlükəsiz saxlamağa kömək edin. Hər gün yanından keçən insanlar dəyişiklikləri bildirə bilməsə, hidrant reyestri bir neçə ay ərzində köhnəlir.", "Community points": "İcma xalları", "25 points per submitted report": "Hər göndərilən hesabat üçün 25 xal", "Reports submitted": "Göndərilən hesabatlar", "Collected by the tərəfdaş deyil. Bu, layihənin kimə ehtiyac duyacağının və hər birinin nə gətirəcəyinin xəritəsidir — iddia kimi deyil, dəvət kimi yazılıb.", "Emergency services": "Fövqəladə xidmətlər", "Know which hydrants failed them last year — the single most valuable dataset this project could receive.": "Keçən il hansı hidrantların onları yarı yolda qoyduğunu bilirlər — bu layihənin əldə edə biləcəyi ən dəyərli məlumat dəsti.", "Municipalities": "Bələdiyyələr", "Own the street works that bury, block and occasionally destroy hydrants.": "Hidrantları basdıran, bağlayan və bəzən dağıdan küçə işlərinə cavabdehdirlər.", "Water infrastructure operators": "Su infrastrukturu operatorları", "Hold the pressure and network data that turns a static register into a live one.": "Statik reyestri canlı reyestrə çevirən təzyiq və şəbəkə məlumatlarına sahibdirlər.", "Universities": "Universitetlər", "Can test whether the risk model actually predicts anything, and say so publicly if it does not.": "Risk modelinin həqiqətən nəyisə proqnozlaşdırıb-proqnozlaşdırmadığını yoxlaya və etmirsə, bunu açıq deyə bilərlər.", "Schools": "Məktəblər", "Students can survey their own neighbourhood — the audit stage scales through people, not budget.": "Şagirdlər öz məhəllələrini yoxlaya bilərlər — audit mərhələsi büdcə ilə deyil, insanlarla genişlənir.", "Residents": "Sakinlər", "Pass the same hydrant daily and notice the change nobody logged.": "Hər gün eyni hidrantın yanından keçir və heç kimin qeyd etmədiyi dəyişikliyi görürlər.", "Researchers": "Tədqiqatçılar", "Urban resilience, GIS and civil engineering groups working on infrastructure that is invisible until it fails.": "Sıradan çıxana qədər görünməyən infrastruktur üzərində işləyən şəhər dayanıqlılığı, CİS və mülki mühəndislik qrupları.", "What would help most right now": "Hazırda ən çox nə kömək edərdi", "A real hydrant list for one district": "Bir rayon üçün real hidrant siyahısı", "Even an incomplete paper list beats synthetic coordinates. One district is enough to run the whole pipeline on real records.": "Hətta natamam kağız siyahı da sintetik koordinatlardan yaxşıdır. Bütün prosesi real qeydlər üzərində işə salmaq üçün bir rayon kifayətdir.", "Historical fault records": "Tarixi nasazlıq qeydləri", "The risk model is currently a rule set. Past failures are what would let it be fitted and honestly evaluated.": "Risk modeli hazırda qaydalar toplusudur. Onu uyğunlaşdırmağa və dürüst qiymətləndirməyə imkan verəcək şey keçmiş nasazlıqlardır.", "A field survey partner": "Sahə sorğusu üzrə tərəfdaş", "A school class or volunteer group willing to walk one neighbourhood with the survey form.": "Sorğu forması ilə bir məhəlləni gəzməyə hazır olan məktəb sinfi və ya könüllü qrupu.", "Technical review": "Texniki rəy", "Anyone who works with GIS, water networks or emergency dispatch and is willing to say where this is naive.": "CİS, su şəbəkələri və ya fövqəladə dispetçerlik sahəsində işləyən və bunun harada sadəlövh olduğunu deməyə hazır olan hər kəs.", "Contact the FireShield team": "FireShield komandası ilə əlaqə", "No data transmitted": "Məlumat ötürülmür", "Name": "Ad", "Organisation": "Təşkilat", "University, municipality, utility, school": "Universitet, bələdiyyə, kommunal xidmət, məktəb", "Email": "E-poçt", "Message": "Mesaj", "What would you want FireShield to answer in your district?": "FireShield-in rayonunuzda hansı suala cavab verməsini istərdiniz?", "Send message": "Mesajı göndər", "A name helps us reply properly.": "Ad düzgün cavab verməyimizə kömək edir.", "Enter an email address we can reach you at.": "Sizinlə əlaqə saxlaya biləcəyimiz e-poçt ünvanını daxil edin.", "Tell us what you have in mind.": "Nə düşündüyünüzü bizə deyin.", "Message saved locally.": "Mesaj yerli olaraq saxlanıldı.", "No mail server is connected to this form, so the message was saved in this browser and not transmitted.": "Bu formaya poçt serveri qoşulmayıb, ona görə mesaj bu brauzerdə saxlanıldı və ötürülmədi.", "Write another message": "Başqa mesaj yaz", "Meet the Team": "Komandamızla tanış olun", "A multidisciplinary team combining mathematical modeling, data analytics, infrastructure assessment, and environmental chemistry to advance urban fire safety.": "Şəhər yanğın təhlükəsizliyini inkişaf etdirmək üçün riyazi modelləşdirmə, məlumat analitikası, infrastrukturun qiymətləndirilməsi və ətraf mühit kimyasını birləşdirən multidissiplinar komanda.", "Founder & Organiser": "Təsisçi və təşkilatçı", "Data Analyzer": "Məlumat analitiki", "Water Chemistry & Corrosion Researcher": "Su kimyası və korroziya tədqiqatçısı", "Mathematical Modeling & Optimization Engineer": "Riyazi modelləşdirmə və optimallaşdırma mühəndisi", "Infrastructure Assessment Specialist": "İnfrastrukturun qiymətləndirilməsi üzrə mütəxəssis", "Coordinates the FireShield project, oversees team collaboration, and organizes the development and implementation of project activities.": "FireShield layihəsini koordinasiya edir, komanda əməkdaşlığına nəzarət edir və layihə fəaliyyətlərinin hazırlanmasını və həyata keçirilməsini təşkil edir.", "Applies multivariate statistical modeling, anomaly detection, and geospatial analysis to quantify hydrant performance and identify infrastructure vulnerabilities.": "Hidrantların iş göstəricilərini kəmiyyətcə ölçmək və infrastruktur zəifliklərini müəyyən etmək üçün çoxölçülü statistik modelləşdirmə, anomaliyaların aşkarlanması və geoməkan təhlilini tətbiq edir.", "Researches water composition and chemical factors affecting corrosion, examining their relevance to hydrant reliability and infrastructure durability.": "Suyun tərkibini və korroziyaya təsir edən kimyəvi amilləri araşdırır, onların hidrantların etibarlılığı və infrastrukturun davamlılığı ilə əlaqəsini öyrənir.", "Develops stochastic reliability models, graph-based optimization algorithms, and constrained allocation frameworks to minimize risks and emergency-response inefficiencies.": "Riskləri və fövqəladə reaksiyadakı səmərəsizlikləri minimuma endirmək üçün stoxastik etibarlılıq modelləri, qraf əsaslı optimallaşdırma alqoritmləri və məhdudiyyətli bölgü çərçivələri hazırlayır.", "Examines infrastructure conditions, accessibility, and maintenance considerations to support the assessment of urban fire safety systems.": "Şəhər yanğın təhlükəsizliyi sistemlərinin qiymətləndirilməsini dəstəkləmək üçün infrastrukturun vəziyyətini, əlçatanlığını və texniki xidmət məsələlərini araşdırır.", "Portrait of ${}": "{0} — portret", "About FireShield": "FireShield haqqında", "To make urban fire infrastructure more visible, measurable and resilient through data and technology.": "Məlumat və texnologiya vasitəsilə şəhər yanğın infrastrukturunu daha görünən, ölçülə bilən və dayanıqlı etmək.", "Why hydrants": "Niyə hidrantlar", "A fire hydrant is the least glamorous object in a city and one of the few that has to work perfectly the first time it is used. Most cities know roughly where theirs are. Far fewer know which ones still hold pressure, which are buried under new asphalt, and which have a container parked on top of them.": "Yanğın hidrantı şəhərdə ən az diqqət çəkən obyektdir və ilk istifadədə qüsursuz işləməli olan azsaylı obyektlərdən biridir. Əksər şəhərlər hidrantlarının təxminən harada olduğunu bilir. Lakin hansının hələ təzyiq saxladığını, hansının yeni asfalt altında qaldığını və hansının üstündə konteyner durduğunu bilənlər çox azdır.", "That gap is not usually a technology problem — it is a record-keeping problem. FireShield treats each hydrant as a data point with a lifecycle: surveyed, scored, re-checked, repaired. Once a city can see the whole network at once, questions that used to be guesswork become arithmetic: which district is most exposed, where the next crew should go, what a fire at a given address would actually have to work with.": "Bu boşluq adətən texnologiya problemi deyil — uçot problemidir. FireShield hər hidrantı həyat dövrü olan məlumat nöqtəsi kimi nəzərdən keçirir: yoxlanılır, qiymətləndirilir, yenidən yoxlanılır, təmir olunur. Şəhər bütün şəbəkəni bir anda görə bildikdə, əvvəllər təxmin olan suallar hesablamaya çevrilir: hansı rayon ən həssasdır, növbəti briqada hara getməlidir, müəyyən ünvanda yanğın zamanı həqiqətən nədən istifadə etmək olar.", "FireShield runs that lifecycle for Baku as one system: a hydrant register with a fixed schema, a live map, a rule-based risk model, an incident simulator and a civic reporting channel, all reading the same records. The register holds a synthetic reference dataset of ${} hydrants across ${} districts, which exercises every component end to end.": "FireShield bu həyat dövrünü Bakı üçün vahid sistem kimi idarə edir: sabit sxemli hidrant reyestri, canlı xəritə, qaydalara əsaslanan risk modeli, hadisə simulyatoru və vətəndaş məlumat kanalı — hamısı eyni qeydləri oxuyur. Reyestrdə {1} rayon üzrə {0} hidrantdan ibarət sintetik istinad məlumat dəsti var və o, hər komponenti əvvəldən axıradək işə salır.", "Technologies and methods": "Texnologiyalar və metodlar", "OpenStreetMap basemaps": "OpenStreetMap xəritə altlıqları", "Rule-based risk scoring": "Qaydalara əsaslanan risk qiymətləndirməsi", "Haversine distance": "Haversin məsafəsi", "Browser storage": "Brauzer yaddaşı", "GIS": "CİS", "Risk is scored from 0 to 100 using eight weighted condition factors, and each hydrant's status is derived from that score. Simulation distances are great-circle (haversine) distances, and supply is estimated at 220 l/min per bar from the three nearest usable hydrants.": "Risk səkkiz çəkili vəziyyət amili əsasında 0-dan 100-ə qədər qiymətləndirilir və hər hidrantın statusu bu baldan hesablanır. Simulyasiya məsafələri böyük dairə (haversin) məsafələridir, təchizat isə ən yaxın üç yararlı hidrantdan hər bar üçün 220 l/dəq hesablanır.", "Data and method notes": "Məlumat və metod qeydləri", "Hydrant records are a synthetic reference dataset for Baku. No record comes from an emergency service, water utility or municipality.": "Hidrant qeydləri Bakı üçün sintetik istinad məlumat dəstidir. Heç bir qeyd fövqəladə xidmətdən, su təchizatı müəssisəsindən və ya bələdiyyədən götürülməyib.", "The risk score is a transparent rule set (services/riskModel.js), not a trained model, and has not been validated against real failure records.": "Risk balı öyrədilmiş model deyil, şəffaf qaydalar toplusudur (services/riskModel.js) və real nasazlıq qeydləri ilə təsdiqlənməyib.", "The digital twin uses straight-line distance and a fixed flow-per-bar assumption. It supports planning and is not operational guidance for a fire crew.": "Rəqəmsal əkiz düz xətt məsafəsindən və hər bar üçün sabit axın fərziyyəsindən istifadə edir. O, planlaşdırmaya kömək edir və yanğınsöndürənlər üçün operativ təlimat deyil.", "Register edits, citizen reports and contact messages are stored in the visitor's browser. No shared server or sensor feed is connected, and no personal data is collected.": "Reyestr düzəlişləri, vətəndaş hesabatları və əlaqə mesajları ziyarətçinin brauzerində saxlanılır. Ümumi server və ya sensor axını qoşulmayıb və heç bir şəxsi məlumat toplanmır.", "An independent student project. It is not affiliated with, endorsed by or supplied with data from any emergency service or government body.": "Müstəqil tələbə layihəsi. Heç bir fövqəladə xidmət və ya dövlət orqanı ilə əlaqəli deyil, onlar tərəfindən dəstəklənmir və onlardan məlumat almır.", "Implementation": "Tətbiq", "The seven components of FireShield, in the order they were built. Each status is checked live against the data loaded in this page.": "FireShield-in yeddi komponenti, qurulma ardıcıllığı ilə. Hər status bu səhifədə yüklənmiş məlumatlara görə canlı yoxlanılır.", "Stage ${}": "Mərhələ {0}", "How the code is organised": "Kod necə təşkil olunub", "Components never touch storage directly. Everything goes through": "Komponentlər yaddaşa birbaşa müraciət etmir. Hər şey bunun vasitəsilə keçir:", "and": "və", "— all of them async already. Replacing the browser storage adapter with Supabase, PostgreSQL or a REST API means rewriting one file, not the interface.": "— hamısı artıq asinxrondur. Brauzer yaddaşı adapterini Supabase, PostgreSQL və ya REST API ilə əvəz etmək interfeysi deyil, bir faylı yenidən yazmaq deməkdir.", "Open the map": "Xəritəni aç", "Get in touch": "Əlaqə saxla", "${} of ${} records carry an inspection date · latest ${} · ${}": "{1} qeyddən {0}-də yoxlama tarixi var · sonuncu: {2} · {3}", "${} photos on file": "{0} foto mövcuddur", "${} records · ${} districts · stored in ${}": "{0} qeyd · {1} rayon · saxlanma yeri: {2}", "${} of ${} records plotted at their coordinates": "{1} qeyddən {0}-i öz koordinatlarında xəritədədir", "${} records scored · mean risk ${}% · rule-based scoring, not a trained machine-learning model": "{0} qeyd qiymətləndirilib · orta risk {1}% · qaydalara əsaslanan qiymətləndirmə, öyrədilmiş maşın öyrənməsi modeli deyil", "${} scenarios plus any point on the map · ${}: ${} usable of ${} hydrants within 1.2 km": "{0} ssenari və xəritədə istənilən nöqtə · {1}: 1,2 km radiusda {3} hidrantdan {2}-i yararlıdır", "${} report${} recorded · new submissions are stored in this browser — no shared reporting server is configured": "{0} hesabat qeydə alınıb · yeni göndərişlər bu brauzerdə saxlanılır — ümumi hesabat serveri qoşulmayıb", "Sensor feed: none configured · register dataset dated ${} · latest inspection ${}": "Sensor axını: qoşulmayıb · reyestr məlumat dəstinin tarixi {0} · son yoxlama {1}", "Hydrant reference image": "Hidrant istinad şəkli", "Image ${} of ${}": "Şəkil {0} / {1}", "${} of ${} records shown with a hydrant reference image": "{1} qeyddən {0}-i hidrant istinad şəkli ilə göstərilir", "Photo upload is not connected. A hydrant reference image is assigned to the record automatically.": "Foto yükləmə qoşulmayıb. Qeydə avtomatik olaraq hidrant istinad şəkli təyin edilir."},S={"park edge": "park kənarı", "hospital approach": "xəstəxanaya yaxınlaşma", "school approach": "məktəbə yaxın
